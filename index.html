<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be.ar | Teaser</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .bg-teaser {
            background-image: url('bear_vertical.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="w-full min-h-screen bg-teaser flex flex-col justify-center items-center p-4 relative">

    <!-- Dark Gradient Overlay for Readability -->
    <div class="absolute inset-0 bg-black/35 backdrop-blur-[1px] z-0"></div>

    <!-- Countdown Container -->
    <main class="relative z-10 w-full max-w-sm mx-auto space-y-4">

        <!-- 1. 200 Days D-Day Only -->
        <a href="anniversary.html" class="block bg-black/45 backdrop-blur-md rounded-3xl py-6 px-5 border border-white/20 shadow-2xl text-center transform transition hover:scale-105">
            <div id="dday-200" class="font-jua text-3xl text-white tracking-wider">
                D-00
            </div>
        </a>

        <!-- 2. Christmas D-Day Only -->
        <a href="christmas.html" class="block bg-black/45 backdrop-blur-md rounded-3xl py-6 px-5 border border-white/20 shadow-2xl text-center transform transition hover:scale-105">
            <div id="dday-xmas" class="font-jua text-3xl text-white tracking-wider">
                D-00
            </div>
        </a>

        <!-- Instagram Link -->
        <div class="text-center pt-2">
            <a href="https://instagram.com/be.archiv2" target="_blank" class="inline-block text-xs font-jua text-gray-300 hover:text-white tracking-widest bg-black/30 px-4 py-2 rounded-full backdrop-blur-sm border border-white/10 transition">
                @be.archiv2
            </a>
        </div>

    </main>

    <!-- D-Day Calculation Logic -->
    <script>
        const target200 = new Date("2026-11-10T00:00:00").getTime();
        const targetXmas = new Date("2026-12-24T19:00:00").getTime();

        function updateDDays() {
            const now = new Date().getTime();

            // 1. 200 Days D-Day
            const dist200 = target200 - now;
            if (dist200 < 0) {
                document.getElementById('dday-200').innerText = "🎉 200일 축하합니다!";
            } else {
                const days200 = Math.ceil(dist200 / (1000 * 60 * 60 * 24));
                document.getElementById('dday-200').innerText = `D - ${days200}`;
            }

            // 2. Christmas D-Day
            const distXmas = targetXmas - now;
            if (distXmas < 0) {
                document.getElementById('dday-xmas').innerText = "🎄 크리스마스 파티 시작!";
            } else {
                const daysXmas = Math.ceil(distXmas / (1000 * 60 * 60 * 24));
                document.getElementById('dday-xmas').innerText = `D - ${daysXmas}`;
            }
        }

        updateDDays();
        setInterval(updateDDays, 60000); // update every minute
    </script>
</body>
</html>
