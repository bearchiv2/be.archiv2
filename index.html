<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be.ar | Teaser</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .bg-teaser {
            background-image: url('bear_vertical.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="w-full min-h-screen bg-teaser flex flex-col justify-center items-center p-4 relative">

    <!-- Dark Gradient Overlay for Readability -->
    <div class="absolute inset-0 bg-black/35 backdrop-blur-[1px] z-0"></div>

    <!-- Countdown Container -->
    <main class="relative z-10 w-full max-w-sm mx-auto space-y-4">

        <!-- 1. 200 Days Countdown Only -->
        <a href="anniversary.html" class="block bg-black/45 backdrop-blur-md rounded-3xl p-5 border border-white/20 shadow-2xl transform transition hover:scale-105">
            <div id="countdown-200" class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="d200-days" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">일</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="d200-hours" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">시간</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="d200-minutes" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">분</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="d200-seconds" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">초</span>
                </div>
            </div>
        </a>

        <!-- 2. Christmas Countdown Only -->
        <a href="index.html" class="block bg-black/45 backdrop-blur-md rounded-3xl p-5 border border-white/20 shadow-2xl transform transition hover:scale-105">
            <div id="countdown-xmas" class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="dxmas-days" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">일</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="dxmas-hours" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">시간</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="dxmas-minutes" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">분</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-2 backdrop-blur-sm">
                    <span id="dxmas-seconds" class="block font-jua text-xl text-white">00</span>
                    <span class="text-[10px] text-gray-300">초</span>
                </div>
            </div>
        </a>

    </main>

    <!-- Dual Countdown Logic -->
    <script>
        const target200 = new Date("2026-11-10T00:00:00").getTime();
        const targetXmas = new Date("2026-12-24T19:00:00").getTime();

        function updateCountdowns() {
            const now = new Date().getTime();

            // 1. 200 Days Countdown
            const dist200 = target200 - now;
            if (dist200 < 0) {
                document.getElementById('countdown-200').innerHTML = '<div class="col-span-4 font-jua text-base text-[#FFD700] py-2">🎉 200일이 되었습니다! 🤎</div>';
            } else {
                const d = Math.floor(dist200 / (1000 * 60 * 60 * 24));
                const h = Math.floor((dist200 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist200 % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist200 % (1000 * 60)) / 1000);
                document.getElementById('d200-days').innerText = String(d).padStart(2, '0');
                document.getElementById('d200-hours').innerText = String(h).padStart(2, '0');
                document.getElementById('d200-minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('d200-seconds').innerText = String(s).padStart(2, '0');
            }

            // 2. Christmas Countdown
            const distXmas = targetXmas - now;
            if (distXmas < 0) {
                document.getElementById('countdown-xmas').innerHTML = '<div class="col-span-4 font-jua text-base text-[#FFD700] py-2">🎄 크리스마스 파티 시작! 🎅</div>';
            } else {
                const d = Math.floor(distXmas / (1000 * 60 * 60 * 24));
                const h = Math.floor((distXmas % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distXmas % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distXmas % (1000 * 60)) / 1000);
                document.getElementById('dxmas-days').innerText = String(d).padStart(2, '0');
                document.getElementById('dxmas-hours').innerText = String(h).padStart(2, '0');
                document.getElementById('dxmas-minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('dxmas-seconds').innerText = String(s).padStart(2, '0');
            }
        }

        setInterval(updateCountdowns, 1000);
        updateCountdowns();
    </script>
</body>
</html>
